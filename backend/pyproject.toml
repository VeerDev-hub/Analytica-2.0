[project]
name = "analytica-backend"
version = "0.1.0"
description = "Analytica Studio 2.0 API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "boto3>=1.35",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "email-validator>=2.2",
    "pgvector>=0.3.6",
    "pandas>=2.2,<3.0",
    "numpy>=2.0",
    "pyarrow>=18",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "charset-normalizer>=3.4",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "imbalanced-learn>=0.13",
    "joblib>=1.4",
    "plotly>=5.24",
    "google-genai>=1.30",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]  # try/except/pass is clearer than contextlib.suppress here

[tool.ruff.lint.per-file-ignores]
"app/engine/codegen/*" = ["E501"]  # long lines inside generated-code templates

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
