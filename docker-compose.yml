# Local development stack: api, worker, Postgres+pgvector, Redis, SeaweedFS (S3 stand-in).
#   docker compose up --build
# API docs:     http://localhost:8000/api/docs
# S3 endpoint:  http://localhost:8333
# Frontend runs on the host: cd frontend && npm run dev  (http://localhost:5173)

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-analytica}:${POSTGRES_PASSWORD:-analytica}@postgres:5432/${POSTGRES_DB:-analytica}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://s3:8333
  S3_BUCKET: ${S3_BUCKET:-analytica-data}
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-analytica}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-analytica-secret}
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
  # Chat (Phase 4) is disabled until a key is set in .env
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  CHAT_MODEL: ${CHAT_MODEL:-gemini-3.5-flash}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

x-backend-depends: &backend-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  storage-init:
    condition: service_completed_successfully

services:
  api:
    build: ./backend
    image: analytica-backend:local
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    environment: *backend-env
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/srv
    depends_on: *backend-depends
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/livez')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    image: analytica-backend:local
    command: celery -A app.tasks.celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend-env
    volumes:
      - ./backend:/srv
    depends_on: *backend-depends

  # Celery beat: hourly purge of deleted projects and expired exports.
  beat:
    build: ./backend
    image: analytica-backend:local
    command: celery -A app.tasks.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    environment: *backend-env
    volumes:
      - ./backend:/srv
    depends_on: *backend-depends

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analytica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytica}
      POSTGRES_DB: ${POSTGRES_DB:-analytica}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store (stand-in for AWS S3). MinIO no longer publishes free images.
  # Credentials live in infra/local/seaweedfs-s3.json and must match S3_ACCESS_KEY/S3_SECRET_KEY.
  s3:
    image: chrislusf/seaweedfs:4.53
    command: >
      server -dir=/data -ip=s3 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${S3_HOST_PORT:-8333}:8333"
    volumes:
      - s3data:/data
      - ./infra/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the private data bucket, then exits.
  storage-init:
    build: ./backend
    image: analytica-backend:local
    command: python -m app.storage.init_bucket
    environment: *backend-env
    depends_on:
      s3:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
